<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King AI Freelance | Secure Studio</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100">

    <!-- Auth Screen -->
    <div id="authScreen" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-6">
        <div class="max-w-md w-full bg-slate-900 p-8 rounded-3xl border border-slate-800 text-center">
            <h2 class="text-2xl font-bold mb-6">King AI <span class="text-indigo-500">Secure Access</span></h2>
            <div id="phoneStep">
                <input id="phoneInput" type="text" placeholder="+1234567890" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 mb-4 outline-none">
                <button onclick="sendOTP()" class="w-full bg-indigo-600 py-3 rounded-xl hover:bg-indigo-500 transition">Send OTP</button>
            </div>
            <div id="otpStep" class="hidden">
                <input id="otpInput" type="text" placeholder="6-digit code" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 mb-4 outline-none">
                <button onclick="verifyOTP()" class="w-full bg-emerald-600 py-3 rounded-xl hover:bg-emerald-500 transition">Verify & Enter Studio</button>
            </div>
        </div>
    </div>

    <!-- Studio Screen -->
    <div id="studioScreen" class="hidden min-h-screen">
        <header class="border-b border-slate-800 p-6 flex justify-between items-center">
            <h1 class="text-xl font-bold">King AI <span class="text-indigo-500">Studio</span></h1>
            <button onclick="location.reload()" class="text-xs text-slate-500">Sign Out</button>
        </header>
        <main class="max-w-7xl mx-auto p-12 text-center">
            <h2 class="text-3xl font-bold">Welcome to the Pro Studio</h2>
            <p class="text-slate-400 mt-4">Your identity is verified. You can now access your project library and design tools.</p>
        </main>
    </div>

    <script>
        // CONFIG: Replace with your actual Firebase project data
        const firebaseConfig = { apiKey: "AIza...", authDomain: "...", projectId: "...", storageBucket: "...", messagingSenderId: "...", appId: "..." };
        firebase.initializeApp(firebaseConfig);

        function sendOTP() {
            document.getElementById('phoneStep').classList.add('hidden');
            document.getElementById('otpStep').classList.remove('hidden');
            console.log("OTP Sent to user mobile...");
        }

        function verifyOTP() {
            // After Firebase Auth confirmation:
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('studioScreen').classList.remove('hidden');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King AI Freelance | Interactive Design Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased">

    <!-- Navbar -->
    <header class="border-b border-slate-800 bg-slate-950">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <h1 class="text-xl font-bold text-white">King AI <span class="text-indigo-400">Studio</span></h1>
            <button onclick="downloadCanvas()" class="bg-indigo-600 px-6 py-2 rounded-xl text-sm font-medium hover:bg-indigo-500 transition">Download Image</button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="max-w-7xl mx-auto px-6 py-12 grid grid-cols-1 lg:grid-cols-4 gap-8">
        <!-- Asset Library Sidebar -->
        <div class="col-span-1 space-y-4">
            <h3 class="font-semibold text-slate-300 mb-4">Assets</h3>
            <button onclick="addCharacter('Okra')" class="w-full bg-slate-900 border border-slate-800 p-4 rounded-xl text-left hover:border-indigo-500 transition">
                <i class="fa-solid fa-carrot text-indigo-400 mr-2"></i> Add Okra
            </button>
            <button onclick="addCharacter('Cucumber')" class="w-full bg-slate-900 border border-slate-800 p-4 rounded-xl text-left hover:border-indigo-500 transition">
                <i class="fa-solid fa-leaf text-indigo-400 mr-2"></i> Add Cucumber
            </button>
        </div>

        <!-- Canvas Workspace -->
        <div class="col-span-3 bg-slate-900 border border-slate-800 rounded-3xl p-4 min-h-[500px] flex justify-center items-center">
            <canvas id="c" width="600" height="400" class="border border-slate-700 bg-white rounded-xl"></canvas>
        </div>
    </div>

    <script>
        // Initialize Fabric Canvas
        const canvas = new fabric.Canvas('c');

        function addCharacter(name) {
            // Simulate adding an asset (using a text placeholder for this demo)
            const text = new fabric.Text(name, {
                left: 100,
                top: 100,
                fontSize: 30,
                fill: '#4f46e5'
            });
            canvas.add(text);
        }

        function downloadCanvas() {
            const dataURL = canvas.toDataURL({ format: 'png' });
            const link = document.createElement('a');
            link.download = 'design.png';
            link.href = dataURL;
            link.click();
        }
    </script>
</body>
</html>

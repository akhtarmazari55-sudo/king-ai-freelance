<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King AI Freelance | Secure Auth Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100">

    <!-- Auth Wrapper -->
    <div id="authScreen" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-6">
        <div class="max-w-md w-full bg-slate-900 p-8 rounded-3xl border border-slate-800 text-center">
            <h2 class="text-2xl font-bold mb-6">King AI <span class="text-indigo-500">Access</span></h2>
            <input type="text" placeholder="Workspace ID" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 mb-4 outline-none focus:border-indigo-500">
            <button onclick="login()" class="w-full bg-indigo-600 py-3 rounded-xl hover:bg-indigo-500 transition">Enter Workspace</button>
        </div>
    </div>

    <!-- Main Studio (Initially Hidden) -->
    <div id="studioScreen" class="hidden">
        <header class="border-b border-slate-800 p-6 flex justify-between items-center">
            <h1 class="text-2xl font-bold">King AI <span class="text-indigo-500">Pro Studio v5.0</span></h1>
            <button onclick="logout()" class="text-xs text-slate-500 hover:text-white">Sign Out</button>
        </header>

        <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 md:grid-cols-4 gap-8">
            <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 space-y-6">
                <h3 class="font-bold text-xs uppercase tracking-widest text-indigo-400">AI Asset Generator</h3>
                <input id="aiPrompt" type="text" placeholder="e.g. Cartoon tomato..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:border-indigo-500 outline-none">
                <button onclick="generateAIAsset()" class="w-full bg-violet-600 p-3 rounded-xl hover:bg-violet-500 text-sm font-medium transition">Generate & Drop</button>
            </div>

            <div class="md:col-span-3 bg-slate-900 border border-slate-800 rounded-3xl p-4 shadow-2xl">
                <canvas id="mainCanvas" class="bg-white rounded-xl"></canvas>
            </div>
        </main>
    </div>

    <script>
        // Simple Auth Logic
        function login() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('studioScreen').classList.remove('hidden');
        }
        function logout() {
            location.reload();
        }

        const canvas = new fabric.Canvas('mainCanvas', { width: 800, height: 600 });

        function generateAIAsset() {
            const mockAsset = 'https://cdn-icons-png.flaticon.com/128/3069/3069171.png';
            fabric.Image.fromURL(mockAsset, function(img) {
                img.scale(0.5);
                canvas.add(img);
            }, { crossOrigin: 'anonymous' });
        }
    </script>
</body>
</html>

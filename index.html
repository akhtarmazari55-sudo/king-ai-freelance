<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King AI Freelance | Design Resource Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-50 backdrop-blur-md bg-slate-950/80 border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-indigo-500 to-violet-500 p-2.5 rounded-xl">
                    <i class="fa-solid fa-wand-magic-sparkles text-white"></i>
                </div>
                <span class="text-xl font-bold text-white">King AI <span class="text-indigo-400">Freelance</span></span>
            </div>
            <nav class="hidden md:flex space-x-8 text-sm text-slate-300 font-medium">
                <a href="#library" class="hover:text-indigo-400 transition">Design Library</a>
                <a href="#studio" class="hover:text-indigo-400 transition">AI Studio</a>
                <a href="#workspace" class="hover:text-indigo-400 transition">Workspace</a>
            </nav>
        </div>
    </header>

    <!-- Asset Library Section -->
    <section id="library" class="py-24">
        <div class="max-w-7xl mx-auto px-6">
            <div class="text-center mb-16">
                <h2 class="text-xs font-bold uppercase tracking-widest text-indigo-400 mb-3">Resource Vault</h2>
                <p class="text-4xl font-bold text-white">Pro Design Asset Library</p>
            </div>

            <!-- Category Tabs -->
            <div class="flex flex-wrap justify-center gap-4 mb-12">
                <button onclick="filterAssets('all')" class="bg-indigo-600 px-6 py-2 rounded-full text-sm font-medium transition">All Assets</button>
                <button onclick="filterAssets('character')" class="bg-slate-900 border border-slate-800 px-6 py-2 rounded-full text-sm font-medium hover:border-indigo-500 transition">Characters</button>
                <button onclick="filterAssets('template')" class="bg-slate-900 border border-slate-800 px-6 py-2 rounded-full text-sm font-medium hover:border-indigo-500 transition">Templates</button>
            </div>

            <!-- Grid -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
                <!-- Sample Asset Item -->
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl group hover:border-indigo-500/50 transition">
                    <div class="h-40 bg-slate-950 rounded-xl mb-4 flex items-center justify-center text-indigo-500/50 text-4xl">
                        <i class="fa-solid fa-carrot"></i>
                    </div>
                    <h4 class="text-sm font-semibold text-white">Okra Character Sprite</h4>
                    <p class="text-xs text-slate-500 mt-1">Category: Character</p>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl group hover:border-indigo-500/50 transition">
                    <div class="h-40 bg-slate-950 rounded-xl mb-4 flex items-center justify-center text-indigo-500/50 text-4xl">
                        <i class="fa-solid fa-file-lines"></i>
                    </div>
                    <h4 class="text-sm font-semibold text-white">Script Layout v1</h4>
                    <p class="text-xs text-slate-500 mt-1">Category: Template</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Script to simulate filtering -->
    <script>
        function filterAssets(cat) {
            alert('Filtering library by: ' + cat);
        }
    </script>
</body>
</html>

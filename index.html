<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King AI Freelance | Project Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100">

    <!-- Auth Screen -->
    <div id="authScreen" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-6">
        <div class="max-w-md w-full bg-slate-900 p-8 rounded-3xl border border-slate-800 text-center">
            <h2 class="text-2xl font-bold mb-6">King AI <span class="text-indigo-500">Access</span></h2>
            <input id="workspaceID" type="text" placeholder="Workspace ID" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 mb-4 outline-none focus:border-indigo-500">
            <button onclick="login()" class="w-full bg-indigo-600 py-3 rounded-xl hover:bg-indigo-500 transition">Enter Workspace</button>
        </div>
    </div>

    <!-- Main Studio -->
    <div id="studioScreen" class="hidden">
        <header class="border-b border-slate-800 p-6 flex justify-between items-center">
            <h1 class="text-xl font-bold">King AI <span class="text-indigo-500">Studio</span></h1>
            <div class="flex items-center gap-4">
                <input id="projectName" type="text" placeholder="Project Name" class="bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 text-sm">
                <button onclick="saveProject()" class="bg-emerald-600 px-4 py-2 rounded-xl text-xs hover:bg-emerald-500">Save Project</button>
            </div>
        </header>

        <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 md:grid-cols-4 gap-8">
            <!-- Project Manager Sidebar -->
            <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800">
                <h3 class="font-bold text-xs uppercase text-indigo-400 mb-4">Project Library</h3>
                <div id="projectList" class="space-y-2"></div>
            </div>

            <!-- Canvas -->
            <div class="md:col-span-3 bg-slate-900 border border-slate-800 rounded-3xl p-4 shadow-2xl">
                <canvas id="mainCanvas" class="bg-white rounded-xl"></canvas>
            </div>
        </main>
    </div>

    <script>
        const canvas = new fabric.Canvas('mainCanvas', { width: 800, height: 600 });
        let projects = JSON.parse(localStorage.getItem('myProjects') || '{}');

        function login() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('studioScreen').classList.remove('hidden');
            renderProjectList();
        }

        function saveProject() {
            const name = document.getElementById('projectName').value || 'Untitled';
            projects[name] = canvas.toJSON();
            localStorage.setItem('myProjects', JSON.stringify(projects));
            renderProjectList();
        }

        function renderProjectList() {
            const list = document.getElementById('projectList');
            list.innerHTML = '';
            Object.keys(projects).forEach(name => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-3 bg-slate-800 rounded-xl text-xs hover:bg-slate-700';
                btn.textContent = name;
                btn.onclick = () => {
                    canvas.loadFromJSON(projects[name], canvas.renderAll.bind(canvas));
                    document.getElementById('projectName').value = name;
                };
                list.appendChild(btn);
            });
        }
    </script>
</body>
</html>

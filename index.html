<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King AI Freelance | Pro Studio v4.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100">

    <header class="border-b border-slate-800 p-6 flex justify-between items-center">
        <h1 class="text-2xl font-bold">King AI <span class="text-indigo-500">Pro Studio v4.0</span></h1>
        <div class="space-x-4">
            <span id="saveStatus" class="text-xs text-slate-500 mr-4">All changes saved</span>
            <button onclick="downloadDesign()" class="bg-indigo-600 px-6 py-2 rounded-xl text-sm hover:bg-indigo-500 transition">Export</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 md:grid-cols-4 gap-8">
        <!-- Sidebar -->
        <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 space-y-6">
            <h3 class="font-bold text-xs uppercase tracking-widest text-indigo-400">AI Asset Generator</h3>
            <div class="space-y-2">
                <input id="aiPrompt" type="text" placeholder="e.g. Cartoon tomato..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:border-indigo-500 outline-none">
                <button onclick="generateAIAsset()" class="w-full bg-violet-600 p-3 rounded-xl hover:bg-violet-500 text-sm font-medium transition">Generate & Drop</button>
            </div>

            <h3 class="font-bold text-xs uppercase tracking-widest text-indigo-400 pt-4">Layer Control</h3>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="bringToFront()" class="bg-indigo-900/50 border border-indigo-500 p-3 rounded-xl text-xs hover:bg-indigo-800">Front</button>
                <button onclick="sendToBack()" class="bg-indigo-900/50 border border-indigo-500 p-3 rounded-xl text-xs hover:bg-indigo-800">Back</button>
            </div>
            <button onclick="deleteObject()" class="w-full bg-red-900/20 border border-red-900 p-3 rounded-xl hover:bg-red-900 text-red-400 text-xs">Delete Selected</button>
        </div>

        <!-- Canvas -->
        <div class="md:col-span-3 bg-slate-900 border border-slate-800 rounded-3xl p-4 overflow-hidden shadow-2xl">
            <canvas id="mainCanvas" class="bg-white rounded-xl"></canvas>
        </div>
    </main>

    <script>
        const canvas = new fabric.Canvas('mainCanvas', { width: 800, height: 600 });

        // Persistence
        const savedData = localStorage.getItem('canvasState');
        if (savedData) canvas.loadFromJSON(savedData, canvas.renderAll.bind(canvas));

        function saveState() {
            localStorage.setItem('canvasState', JSON.stringify(canvas.toJSON()));
            document.getElementById('saveStatus').textContent = 'Saved';
        }

        // AI Asset Generator (Simulation)
        function generateAIAsset() {
            const prompt = document.getElementById('aiPrompt').value;
            if (!prompt) return;
            
            // Simulating API return of a generated graphic
            const mockAsset = 'https://cdn-icons-png.flaticon.com/128/3069/3069171.png'; // Placeholder for AI image
            fabric.Image.fromURL(mockAsset, function(img) {
                img.scale(0.5);
                canvas.add(img);
                saveState();
            }, { crossOrigin: 'anonymous' });
        }

        canvas.on('object:modified', saveState);
        canvas.on('object:added', saveState);

        function bringToFront() { const obj = canvas.getActiveObject(); if (obj) { canvas.bringToFront(obj); saveState(); } }
        function sendToBack() { const obj = canvas.getActiveObject(); if (obj) { canvas.sendToBack(obj); saveState(); } }
        function deleteObject() { const obj = canvas.getActiveObject(); if (obj) { canvas.remove(obj); saveState(); } }
        function downloadDesign() {
            const link = document.createElement('a');
            link.download = 'king-ai-design.png';
            link.href = canvas.toDataURL({ format: 'png' });
            link.click();
        }
    </script>
</body>
</html>
